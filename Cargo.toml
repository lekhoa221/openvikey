[workspace]
resolver = "3"
members = [
    "crates/openvikey-core",
    "crates/openvikey-lab",
    "crates/openvikey-session",
    "crates/openvikey-win",
    "crates/openvikey-win-context",
    "crates/openvikey-win-tsf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["OpenViKey Authors"]
license = "MIT"
repository = "https://github.com/lekhoa221/openvikey"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
zeroize = { version = "1.8", features = ["derive"] }
arc-swap = "1.7"
crossbeam-queue = "0.3"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Ole",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_ProcessStatus",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
doc_markdown = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
